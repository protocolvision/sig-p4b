<html lang="en">

<title>Report Template Draft</title>
<style>
/* Layout: a memo in the protocolvision.org brand. One 46rem column of running prose, every heading a full statement.
   One typeface: JetBrains Mono, self-hosted (fonts/). Paper, ink, cobalt for actions/current state, forest for "hard".
   Hard = solid, soft = frayed/dashed. Figures animate in once when scrolled into view; reduced motion shows the final state. */
@font-face { font-family: "JetBrains Mono"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/jetbrains-mono-latin-400.woff2") format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/jetbrains-mono-latin-500.woff2") format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/jetbrains-mono-latin-700.woff2") format("woff2"); }
:root {
  color-scheme: light;
  --bg: #f9f8f5;          /* paper */
  --fg: #2c2c2a;          /* ink */
  --muted: #5f5e5a;       /* ink-2 */
  --rule: #d9d6cf;        /* hair: faint guides only, never the only carrier of meaning */
  --line: #8a8780;        /* chart axes: 3:1 on paper */
  --fill: #f1efe9;
  --action: #004fcc;      /* cobalt: links, highlights, the current state */
  --action-hover: #003a96;
  --accent: #0f6e56;      /* forest: hard, confirmed */
  --on-accent: #ffffff;   /* text on a forest or cobalt fill */
  --warn: #a8481b;        /* contradicts / caveat: always paired with a shape and a word */
  --font: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #161614; --fg: #ebe9e3; --muted: #a9a7a0; --rule: #3a3935; --line: #77756e; --fill: #201f1c;
  --action: #7ba6ff; --action-hover: #a8c4ff; --accent: #4fb897; --on-accent: #10100e; --warn: #e48a5c;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #161614; --fg: #ebe9e3; --muted: #a9a7a0; --rule: #3a3935; --line: #77756e; --fill: #201f1c;
  --action: #7ba6ff; --action-hover: #a8c4ff; --accent: #4fb897; --on-accent: #10100e; --warn: #e48a5c;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.75 var(--font); font-variant-numeric: tabular-nums; }
.wrap { max-width: 46rem; margin: 0 auto; padding-inline: 1.25rem; padding-block: 0 4rem; }
:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; border-radius: 2px; }
a { color: var(--action); text-underline-offset: .2em; } a:hover { color: var(--action-hover); }
h1 { font-size: clamp(1.5rem, 4.4vw, 2.15rem); line-height: 1.25; font-weight: 400; letter-spacing: -.025em; margin: .5rem 0 1rem; text-wrap: balance; }
h2 { font-size: clamp(1.35rem, 3.4vw, 1.7rem); line-height: 1.25; font-weight: 700; letter-spacing: -.015em; margin: 0 0 .6rem; text-wrap: balance; }
h3 { font-size: 1rem; line-height: 1.5; font-weight: 700; margin: 0 0 .3rem; text-wrap: balance; }
p { margin: 0 0 1rem; }
.dek { color: var(--muted); margin: 0 0 1rem; }
h1 + .dek { font-size: 1.05rem; }
.muted, .small { color: var(--muted); }
.small { font-size: 13px; line-height: 1.6; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1.5rem 0; font-size: 14px; color: var(--muted); }
.top b { font-weight: 700; color: var(--fg); display: inline-flex; align-items: center; gap: .55rem; }
.top svg { width: 22px; height: 22px; flex: none; }
.mk-ink { fill: var(--fg); } .mk-core { stroke: var(--action); } .mk-grid { stroke: var(--muted); }
.series { color: var(--muted); font-size: 12px; letter-spacing: .1em; margin: 1.5rem 0 0; }
.contents { color: var(--muted); font-size: 13px; line-height: 1.7; margin: 1.2rem 0 0; }
.contents a { color: var(--muted); text-decoration-color: var(--line); }
.contents a:hover { color: var(--action); }
section.memo { margin-top: 3.25rem; scroll-margin-top: 1rem; }
section.memo:first-of-type { margin-top: 2.25rem; }
.n { max-width: none; font-size: 12px; letter-spacing: .1em; color: var(--muted); margin: 0 0 1rem; padding-top: 1rem; border-top: .5px solid var(--rule); }
.finding { margin-top: 2.5rem; }
.ask { margin: 1.1rem 0 .9rem; padding-left: 1rem; border-left: 2px solid var(--accent); font-weight: 500; }
.finding h3 { font-size: 1.1rem; margin-bottom: .6rem; }
.finding p { margin-bottom: .55rem; }
.finding .basis { font-size: 13px; line-height: 1.6; color: var(--muted); margin-bottom: .6rem; }
.finding .quote { font-style: italic; font-size: 13px; margin: .8rem 0 .2rem 1rem; }
.finding .quote cite { font-style: normal; font-size: 12px; color: var(--muted); margin-left: .4rem; }
.finding .caveat { font-size: 13px; line-height: 1.6; }
.finding .caveat b { color: var(--warn); font-weight: 700; }
figure { margin: 1.9rem 0 0; padding: 0; }
figure > h3 { margin-bottom: .2rem; }
figure > .dek { font-size: 14px; margin-bottom: .8rem; }
figcaption { font-size: 13px; line-height: 1.6; color: var(--muted); margin-top: .6rem; }
.scroll { overflow-x: auto; max-width: 100%; position: relative; }
svg text { font-family: var(--font); fill: var(--fg); }
svg .mut { fill: var(--muted); }
.g-strong { fill: var(--accent); } .g-single { fill: none; stroke: var(--accent); stroke-width: 2; } .g-dot { fill: var(--accent); }
.g-early { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 3 2.5; }
.g-none { stroke: var(--muted); stroke-width: 2; stroke-linecap: round; } .g-contra { stroke: var(--warn); stroke-width: 2.5; stroke-linecap: round; fill: none; }

/* ambient figure: a hard rule that meets a frayed one */
[hidden] { display: none !important; }
.ambient { display: block; width: 100%; height: auto; margin: 1.1rem 0 0; }
.ambient .hard { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: butt; }
.ambient .joint { stroke: var(--accent); stroke-width: 1.5; }
.ambient .strand { fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; }
.ambient .packet { fill: var(--action); }

/* grid */
.gridwrap table { border-collapse: collapse; width: 100%; }
.gridwrap th, .gridwrap td { padding: .45rem .2rem; text-align: center; border-bottom: 1px solid var(--rule); font-weight: 400; }
.gridwrap th[scope=row] { text-align: left; font-size: 13px; line-height: 1.4; min-width: 7.5rem; padding-right: .5rem; }
.gridwrap thead th { font-size: 12px; color: var(--muted); vertical-align: bottom; }
.gridwrap td svg { width: 22px; height: 22px; display: block; margin: auto; }
.legend { display: flex; flex-wrap: wrap; gap: .3rem 1.25rem; margin: .8rem 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: .4rem; }
.legend svg { width: 18px; height: 18px; flex: none; }

/* feature profiles: unboxed rows, the present row set apart by weight and a gap */
.prof { display: grid; gap: .1rem; list-style: none; padding: 0; margin: 0; }
.prow { display: grid; grid-template-columns: 12rem minmax(0, 1fr) 3rem; align-items: center; gap: .5rem; padding: .3rem 0; }
.prow.present { margin-top: .7rem; }
.prow.present .nm { font-weight: 700; }
.prow .nm { font-size: 13px; line-height: 1.3; min-width: 0; }
.prow .sc { font-size: 12px; text-align: right; color: var(--muted); }
.prow svg { width: 100%; height: 22px; display: block; }
.fhead { display: grid; grid-template-columns: 12rem minmax(0, 1fr) 3rem; gap: .5rem; font-size: 11px; color: var(--muted); }
.fhead svg { width: 100%; height: 14px; display: block; }
.fkey { columns: 2 16rem; column-gap: 1.5rem; font-size: 12px; color: var(--muted); padding: 0; list-style: none; margin: .8rem 0 0; }
.fkey li { break-inside: avoid; padding: .1rem 0; } .fkey b { color: var(--fg); font-weight: 700; margin-right: .35rem; }
@media (max-width: 34rem) {
  .prow, .fhead { grid-template-columns: minmax(0, 1fr) 3rem; }
  .prow .nm { grid-column: 1; } .prow .sc { grid-column: 2; grid-row: 1; } .prow svg { grid-column: 1 / -1; }
  .fhead .h-name { display: none; } .fhead svg { grid-column: 1 / -1; grid-row: 2; } .fhead .h-score { grid-column: 2; grid-row: 1; }
}

/* head to head and timeline: SVG drawn at the container's real width so text stays at its set size */
.chart svg { width: 100%; height: auto; display: block; }
.ev { list-style: none; padding: 0; margin: .8rem 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: .2rem 1.5rem; font-size: 12px; }
.ev li { display: flex; gap: .5rem; } .ev b { flex: none; min-width: 2.2rem; color: var(--muted); font-weight: 700; }
@media (max-width: 46rem) { .ev { grid-template-columns: 1fr; } }

/* changes and next tests: plain paragraphs */
.item { margin: 0 0 1rem; }
.item p { margin: 0; }
.item .small { margin-top: .1rem; }

/* closing note */
.closing p { font-size: 14px; }
details { padding: .35rem 0; }
summary { cursor: pointer; padding: .2rem 0; color: var(--action); font-size: 14px; font-weight: 500; }
summary:hover { color: var(--action-hover); }
details ol, details ul { padding-left: 1.2rem; margin: .5rem 0 0; }
details li { margin-bottom: .45rem; font-size: 13px; }
.src { border-collapse: collapse; width: 100%; min-width: 28rem; font-size: 12px; }
.src th, .src td { text-align: left; padding: .4rem .6rem .4rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.src th { color: var(--muted); font-weight: 700; }
.src td:first-child { white-space: nowrap; }
footer { margin-top: 3.5rem; padding-top: 1rem; border-top: .5px solid var(--rule); color: var(--muted); font-size: 12px; }
@media (max-width: 560px) { body { font-size: 14px; } }
.visually-hidden { position: absolute !important; left: 0; top: 0; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

/* Motion. The script adds .anim to <html> only when motion is allowed and IntersectionObserver exists;
   otherwise none of these start states apply and every figure shows its final state. Each runs once (.in is never removed). */
.anim .a-grow { transform: scale(0); transform-box: fill-box; transform-origin: center; }
.anim .a-draw { stroke-dasharray: 1 1; stroke-dashoffset: 1; }
.anim .a-fade { opacity: 0; }
.anim .a-slide { transform: translateX(var(--dx, 0px)); }
.anim .in .a-grow { transform: none; transition: transform .8s ease-out var(--d, 0s); }
.anim .in .a-draw { stroke-dashoffset: 0; transition: stroke-dashoffset 1.1s ease-out var(--d, 0s); }
.anim .in .a-fade { opacity: 1; transition: opacity .8s ease-out var(--d, 0s); }
.anim .in .a-slide { transform: none; transition: transform 1.1s ease-out var(--d, 0s); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
@media print { .anim .a-grow, .anim .a-slide { transform: none; } .anim .a-draw { stroke-dashoffset: 0; } .anim .a-fade { opacity: 1; } }

/* Hypothesis grid: word column labels turn vertical on narrow screens so the grid fits without scrolling */
@media (max-width: 520px) {
  table.hgrid thead th abbr { writing-mode: vertical-rl; transform: rotate(180deg); display: inline-block; white-space: nowrap; text-decoration: none; }
  table.hgrid thead th { vertical-align: bottom; padding-left: 2px; padding-right: 2px; }
}
</style>
</head>

  <div id="m-tests"></div>
  <p id="m-funnel"></p>
  <p id="m-cov"></p>

</main>
