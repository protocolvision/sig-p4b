# Build, check, and publish the site and the blyg.
# - Every push and pull request: build everything and run the blyg conformance check.
# - Hourly: rebuild and publish only if the responses from other blygs (verified Webmentions) changed.
# - Pushes to main: also publish to protocolsforbusiness.com on Cloudflare (needs the CLOUDFLARE_API_TOKEN
#   and CLOUDFLARE_ACCOUNT_ID secrets) and refresh the redirects at the old here.now address (HERENOW_API_KEY).
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"   # hourly; the check step below skips the build when nothing changed

permissions:
  contents: read

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # blyg versions come from git history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install "markdown>=3.5"

      - name: Check for new responses from other blygs
        id: responses
        if: github.event_name == 'schedule'
        run: |
          now=$(python3 tools/build_blyg.py --mentions-hash)
          site=$(python3 -c "import json;print(json.load(open('config.json'))['site'])")
          live=$(curl -sf "${site}blyg/" | grep -o 'responses:[0-9a-f]*' | cut -d: -f2 || true)
          if [ "$now" = "$live" ]; then echo "unchanged=true" >> "$GITHUB_OUTPUT"; echo "No new responses; nothing to publish."; fi

      - name: Build and check
        if: steps.responses.outputs.unchanged != 'true'
        run: |
          python3 tools/build_schedule.py
          python3 tools/build_site.py
          python3 tools/build_blyg.py
          python3 tools/build_sitemap.py
          python3 tools/blyg_check.py

      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.responses.outputs.unchanged != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set; skipping publish."
            exit 0
          fi
          # Official here.now publish script, pinned to a reviewed commit (used for the old-address redirects).
          curl -fsSL https://raw.githubusercontent.com/heredotnow/skill/0f60d2374d3c8c6ffda1ecad4c0af69f278f7f27/here-now/scripts/publish.sh -o /tmp/publish.sh
          chmod +x /tmp/publish.sh
          HERENOW_PUBLISH=/tmp/publish.sh ./deploy.sh
