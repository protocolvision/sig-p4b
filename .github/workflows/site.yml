# Build, check, and publish the site and the blyg.
# - Every push and pull request: build everything and run the blyg conformance check.
# - Pushes to main: also publish to npc.here.now/protocolvision/ (needs the HERENOW_API_KEY secret).
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # blyg versions come from git history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "markdown>=3.5"

      - name: Build and check
        run: |
          python3 tools/build_schedule.py
          python3 tools/build_site.py
          python3 tools/build_blyg.py
          python3 tools/blyg_check.py

      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
        run: |
          if [ -z "$HERENOW_API_KEY" ]; then
            echo "::notice::HERENOW_API_KEY is not set; skipping publish."
            exit 0
          fi
          # Official here.now publish script, pinned to a reviewed commit.
          curl -fsSL https://raw.githubusercontent.com/heredotnow/skill/0f60d2374d3c8c6ffda1ecad4c0af69f278f7f27/here-now/scripts/publish.sh -o /tmp/publish.sh
          chmod +x /tmp/publish.sh
          HERENOW_PUBLISH=/tmp/publish.sh ./deploy.sh
