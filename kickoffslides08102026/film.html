<style>
/* Layout: a 16:9 stage on paper that scales to the window, with a slim transport bar under it.

:root { --paper:#f9f8f5; --ink:#2c2c2a; --ink2:#5f5e5a; --faint:#b3b0a8; --hair:#d9d6cf; --hard:#0f6e56; --cobalt:#004fcc; --ui-bg:#eceae4; }

  body { padding: 4px 8px; gap: 4px; }
  .stage { width: min(100%, calc((100vh - 40px) * 16 / 9)); }
  .chapters { display: none; }
  .bar { gap: 8px; font-size: 12px; }
  .bar button { padding: 4px 8px; }

<script>
(() => {
// ---------- timeline ----------
const SC = [
  { id: 'lanes',    t: 0,  tag: 'Discovering New Nature: Protocols and AI', cap: 'Simple protocols coordinate an unreasonable amount of the world.', sub: 'Keep to one side of the road, and millions of strangers pass each other every day.', credit: 'After “The Unreasonable Sufficiency of Protocols”, 2024' },
  { id: 'tangle',   t: 7.2,  tag: 'Discovering New Nature: Protocols and AI', cap: 'The better protocols work, the harder they are to see.' },
  { id: 'snap',     t: 13.2, tag: 'Discovering New Nature: Protocols and AI', cap: 'Mostly, we notice when protocols strain and break.' },
  { id: 'ooze',     t: 18, tag: 'Discovering New Nature: Protocols and AI', cap: 'AI finds where protocols leak.' },
  { id: 'underway', t: 24, tag: 'Discovering New Nature: Protocols and AI', cap: 'Changes to how we coordinate with AI are already under way.', sub: 'Agents are plugging in, paying and finding gaps on their own.' },
  { id: 'twin',     t: 31.2, tag: 'Discovering New Nature: Protocols and AI', cap: 'Protocols are AI’s evil twin.', sub: 'Rigid where AI is fluid. Hard rules give agents a clear way through.', credit: 'After Venkatesh Rao, “Constructing the Evil Twin of AI”, 2025' },
  { id: 'hard',     t: 37.2, tag: 'Discovering New Nature: Protocols and AI', cap: 'Hardness makes something very likely to be true in the future.', credit: 'After Josh Stark, “Atoms, Institutions, Blockchains”, 2022' },
  { id: 'archive',  t: 44.4, tag: 'Summer of Protocols · 2023–2025', cap: 'Summer of Protocols set out to study all of this.' },
  { id: 'inst',     t: 50.4, tag: 'Protocol Institute · 2026', cap: 'In 2026 the work became an institute.' },
  { id: 'groups',   t: 55.2, tag: 'Protocol Institute · Research groups', cap: 'Eight groups, each studying protocols from different perspectives.' },
  { id: 'gather',   t: 63.6, tag: 'Protocols for Business', cap: 'Join us to learn to see, design and evolve protocols.' },
  { id: 'themes',   t: 68.4, tag: 'Protocols for Business · 2026–27', cap: 'Six questions we’ll investigate together.', sub: '26 Mondays: read a source, compare notes, bring your own cases.' },
  { id: 'end',      t: 81.6, tag: '', cap: '' },
];
const END = 90, MORPH = 3;

// ---------- canvas and basics ----------
const W = 1920, H = 1080, TAU = Math.PI * 2, VIS_BOTTOM = 770;   // visuals stay above the caption zone
const cv = document.getElementById('c'), g = cv.getContext('2d'), ov = document.getElementById('ov'), stage = document.getElementById('stage');
const fogCv = document.createElement('canvas'), fg = fogCv.getContext('2d');
let k = 1;
function size() { const r = stage.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 1.5); cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); k = cv.width / W; fogCv.width = cv.width; fogCv.height = cv.height; }
new ResizeObserver(() => { size(); render(T); }).observe(stage); size();
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const lerp = (a, b, t) => a + (b - a) * t, clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const C = { paper: [249, 248, 245], ink: [44, 44, 42], ink2: [95, 94, 90], faint: [179, 176, 168], hair: [217, 214, 207], hard: [15, 110, 86], cobalt: [0, 79, 204] };
const MEMBER = [[0, 79, 204], [15, 123, 108], [180, 105, 14], [184, 50, 128], [107, 70, 193], [192, 57, 43], [44, 44, 42]];   // the Feed's member colours

// ---------- the cast ----------
const N = 48, K = 44, M = 700;
const S = Array.from({ length: N }, (_, i) => ({ i, r: [rnd(), rnd(), rnd(), rnd(), rnd()], seed: rnd() * 10 }));
const P = Array.from({ length: M }, (_, j) => ({ j, r: [rnd(), rnd(), rnd(), rnd()] }));

// streamlines around an obstacle, inside the visual zone
function streams(cx, cy, R) {
  const out = [];
  for (let j = 0; j < 120; j++) {
    let y = 110 + (j + .5) / 120 * (VIS_BOTTOM - 140), x = -60; const pts = [];
    for (let s = 0; s < 600 && x < W + 60; s++) { const X = (x - cx) / R, Y = (y - cy) / R, r2 = X * X + Y * Y; const u = 1 - (X * X - Y * Y) / (r2 * r2), v = -2 * X * Y / (r2 * r2); x += u * 4; y += v * 4; pts.push([x, y]); }
    out.push(pts);
  }
  return out;
}
const FLOW = streams(1150, 420, 150);
// the approval flow: four steps in a walled channel with gaps; agents go through in order, then start taking shortcuts
const FY = 420, WT = 365, WB = 475, STEPS = [['REQUEST', 400], ['REVIEW', 760], ['APPROVE', 1120], ['DONE', 1480]];
const GAP_T = [880, 1000], GAP_B = [1210, 1320];
function routeOf(pts) { const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return { pts, L, tot: L[L.length - 1] }; }
function bez(a, c, b, n = 24) { return Array.from({ length: n + 1 }, (_, i) => { const u = i / n, v = 1 - u; return [v * v * a[0] + 2 * v * u * c[0] + u * u * b[0], v * v * a[1] + 2 * v * u * c[1] + u * u * b[1]]; }); }
const ROUTES = [
  routeOf([[140, FY], ...STEPS.map(([, x]) => [x, FY]), [1780, FY]]),                                              // through every step
  routeOf([[140, FY], [400, FY], [760, FY], [940, FY], [940, WT - 10], ...bez([940, WT - 40], [1250, 170], [1820, 300])]),   // out of the top gap, around review and approval
  routeOf([[140, FY], [400, FY], [760, FY], [1120, FY], [1265, FY], [1265, WB + 10], ...bez([1265, WB + 40], [1500, 650], [1820, 560])]),   // out of the bottom gap, around approval
];
const dwell = (x) => STEPS.reduce((d, [, sx]) => d + Math.exp(-(((x - sx) / 46) ** 2)), 0);   // agents slow down at each step
function alongRoute(R, s) { let i = 1; while (i < R.L.length - 1 && R.L[i] < s) i++; const a = R.pts[i - 1], b = R.pts[i], f = (s - R.L[i - 1]) / ((R.L[i] - R.L[i - 1]) || 1); return [lerp(a[0], b[0], f), lerp(a[1], b[1], f), Math.atan2(b[1] - a[1], b[0] - a[0])]; }
function onStream(j, t, speed) { const L = FLOW[j % FLOW.length], n = L.length, p = (P[j].r[0] * n + t * speed * 60) % n, i = Math.floor(p), b = L[Math.max(0, i - 3)]; return { x: L[i][0], y: L[i][1], a: Math.atan2(L[i][1] - b[1], L[i][0] - b[0]), tx: L[Math.max(0, i - 26)][0], ty: L[Math.max(0, i - 26)][1] }; }

// the evil twin's rails: crystal guides that narrow into a gate and open again
const RAILS = 4, railY = (k2, x) => { const base = 230 + k2 * 125, pinch = .45 + .55 * smooth(0, 520, Math.abs(x - 1150)); return 420 + (base - 420) * pinch; };

// shapes
const line = (x0, y0, x1, y1, bend = 0) => (u) => [lerp(x0, x1, u), lerp(y0, y1, u) + Math.sin(u * Math.PI) * bend];
const poly = (pts, closed = true) => (u) => { const segs = closed ? pts.length : pts.length - 1, f = u * segs, i = Math.min(Math.floor(f), segs - 1), a = pts[i], b = pts[(i + 1) % pts.length], v = f - i; return [lerp(a[0], b[0], v), lerp(a[1], b[1], v)]; };
const rect = (x, y, w, h, rot = 0) => { const c = Math.cos(rot), s = Math.sin(rot), p = (dx, dy) => [x + dx * c - dy * s, y + dx * s + dy * c]; return poly([p(-w / 2, -h / 2), p(w / 2, -h / 2), p(w / 2, h / 2), p(-w / 2, h / 2)]); };
const arc = (cx, cy, r, a0, a1) => (u) => { const a = lerp(a0, a1, u); return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
const HIDE = (x = 960, y = 420) => ({ f: line(x, y, x, y), kind: 'line', w: 1, col: C.ink, a: 0 });

// ---------- layouts ----------
const GROUPS = [['Formal Protocol Theory', 360, 230], ['Memory Research Group', 800, 160], ['Protocol Fiction', 1300, 210], ['Distributed Robotics Group', 1520, 380], ['Psychohistory', 1420, 600], ['Personhood Research Group', 820, 640], ['Intelligence Media', 300, 520], ['Protocols for Business', 1040, 410]];
const HUB = [1380, 380];
const p4bLit = (lt) => smooth(4.6, 5.8, lt);   // Protocols for Business lights up near the end of the groups scene
const SHEETS = [[330, 335, -.08], [720, 300, .06], [1110, 325, -.05], [1500, 360, .1], [520, 545, .04], [940, 535, -.03]];
const CELLS = [0, 1, 2, 3, 4, 5].map((i) => [96 + i * 292, 260]), CW = 260, CH = 220;
const cellC = (i) => [CELLS[i][0] + CW / 2, CELLS[i][1] + CH / 2];
const reveal = (c, lt) => smooth(.8 + c * 1.5, 1.5 + c * 1.5, lt);   // the themes appear one at a time
const ROPE = { kind: 'rope', w: 1.3, rw: 3.4, fibres: 2, pitch: 18, col: C.ink, a: 1 };
const roadY = (road, x) => { const y = 260 + road * 100, u = x / W; return y + 30 - 70 * u + Math.sin(u * Math.PI) * 26 * Math.sin(road * 1.3); };

const scenes = {
  lanes(s, t) {   // a street plan from above: roads, kerbs and the centre line
    const i = s.i;
    if (i < 15) { const road = Math.floor(i / 3), part = i % 3, off = part === 0 ? -14 : part === 1 ? 14 : 0; return { f: (u) => { const x = lerp(-40, W + 40, u); return [x, roadY(road, x) + off]; }, kind: 'line', w: part === 2 ? 1 : 1.4, col: part === 2 ? C.faint : C.ink, a: part === 2 ? .9 : .85, dash: part === 2 ? 1 : 0 }; }
    
    return HIDE(960, 500);
  },
  tangle(s, t) {   // the tangle, mostly in fog
    const [r0, r1, r2, r3, r4] = s.r, cx = 140 + r0 * 1640, cy = 140 + r1 * 640, R = 90 + r2 * 200, kk = 2 + Math.floor(r3 * 3), ph = r4 * TAU + t * .04;
    return { ...ROPE, f: (u) => { const a = u * TAU + ph, rr = R * (1 + .35 * Math.sin(a * kk + ph * 2)); return [cx + rr * Math.cos(a) * 1.35, cy + rr * Math.sin(a)]; }, closed: true, rw: 2.6 + r2 * 2.2, col: s.i % 7 ? C.ink : C.hard };

// ---------- the score: a recorded track (kickoff-score.m4a, 90 s), kept in step with the film ----------
// While sound is on, the film follows the audio clock, so picture and sound can't drift apart.
const audio = (() => {
  // The whole track (about 1.8 MB) is fetched once, the first time sound is turned on, so it can seek anywhere on any host.
  const el = document.createElement('audio'); el.preload = 'auto'; document.body.appendChild(el);
  let on = false, lastFix = 0, loading = null;
  const load = () => loading || (loading = (async () => {
    for (const [src, type] of [['kickoff-score.m4a', 'audio/mp4'], ['kickoff-score.mp3', 'audio/mpeg']]) {
      if (!el.canPlayType(type)) continue;
      try { const r = await fetch(src); if (!r.ok) continue; el.src = URL.createObjectURL(await r.blob()); await new Promise((ok, no) => { el.oncanplay = ok; el.onerror = no; }); return true; } catch (e) {}
    }
    return false;
  })());

  return {
    get on() { return on; },
    toggle(T0, playing0) { on = !on; if (on) load().then(() => sync(T, playing)); else el.pause(); return on; },
    restart(T, playing) { sync(T, playing); },
    stop() { el.pause(); },
    clock(T) {   // the film's time while the track is playing; if the track can't seek to where the film is, the film keeps its own time and asks again

      return el.currentTime;
    },
    tick() {},
  };
})();
